<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salon Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">S</div>
      <div>
        <div class="logo-name">Salon Manager</div>
        <div class="logo-sub">Gestionale</div>
      </div>
    </div>
    <ul class="nav-links">
      <li><a href="#" class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard',this)">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a></li>
      <li><a href="#" class="nav-item" data-page="prenotazioni" onclick="navigateTo('prenotazioni',this)">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Prenotazioni
      </a></li>
      <li><a href="#" class="nav-item" data-page="clienti" onclick="navigateTo('clienti',this)">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Clienti
      </a></li>
      <li><a href="#" class="nav-item" data-page="servizi" onclick="navigateTo('servizi',this)">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Servizi
      </a></li>
      <li><a href="#" class="nav-item" data-page="statistiche" onclick="navigateTo('statistiche',this)">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Statistiche
      </a></li>
    </ul>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="main">
    <div id="page-dashboard" class="page active"></div>
    <div id="page-prenotazioni" class="page"></div>
    <div id="page-clienti" class="page"></div>
    <div id="page-servizi" class="page"></div>
    <div id="page-statistiche" class="page"></div>
  </main>

  <!-- MODAL PRENOTAZIONE -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)">
    <div class="modal" id="modal-booking">
      <div class="modal-header">
        <h2 id="modal-title">Nuova prenotazione</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group">
            <label>Cliente *</label>
            <select id="f-cliente"></select>
          </div>
          <div class="form-group">
            <label>Servizio *</label>
            <select id="f-servizio" onchange="onServizioChange()"></select>
          </div>
          <div class="form-group">
            <label>Data *</label>
            <input type="date" id="f-data" />
          </div>
          <div class="form-group">
            <label>Ora *</label>
            <input type="time" id="f-ora" value="09:00" step="1800" />
          </div>
          <div class="form-group">
            <label>Prezzo (€)</label>
            <input type="number" id="f-prezzo" step="0.5" />
          </div>
          <div class="form-group">
            <label>Stato</label>
            <select id="f-stato">
              <option value="confermata">Confermata</option>
              <option value="completata">Completata</option>
              <option value="cancellata">Cancellata</option>
            </select>
          </div>
          <div class="form-group full">
            <label>Note</label>
            <textarea id="f-note" rows="2"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
        <button class="btn btn-primary" onclick="savePrenotazione()">Salva</button>
      </div>
    </div>
  </div>

  <!-- MODAL CLIENTE -->
  <div id="modal-cliente-overlay" class="modal-overlay hidden" onclick="closeModalCliente(event)">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-cliente-title">Nuovo cliente</h2>
        <button class="modal-close" onclick="closeModalCliente()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group">
            <label>Nome *</label>
            <input type="text" id="fc-nome" />
          </div>
          <div class="form-group">
            <label>Cognome *</label>
            <input type="text" id="fc-cognome" />
          </div>
          <div class="form-group">
            <label>Telefono</label>
            <input type="tel" id="fc-telefono" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="fc-email" />
          </div>
          <div class="form-group full">
            <label>Note</label>
            <textarea id="fc-note" rows="2"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModalCliente()">Annulla</button>
        <button class="btn btn-primary" onclick="saveCliente()">Salva</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
